# Tasuki の設定（https://github.com/pkshimizu/tasuki）
# 点検: tasuki check .

github:
  repo: pkshimizu/wordcards

discord:
  channels:
    requirements: "1572949801748791358" # 要件チャンネル
    questions: "1572949822011609099" # 質問チャンネル
    notices: "1572949844459524276" # お知らせチャンネル
  allowed_users:
    - "714417294549450753"

# 工程ごとに auto（CI が合格したら Tasuki がマージ）か human（人が GitHub でマージ）
merge:
  spec: human
  design: human
  implementation: human

limits:
  agents: 2 # 同時に動かす作業エージェントの数

# 作業フォルダ（git worktree）を用意したあとに Tasuki が実行する準備
workspace:
  setup:
    - npm ci
    - npm run db:env # ローカルの Supabase の接続先を .env.local に書き出す
  setup_on_change:
    - package-lock.json
poll_interval: 45
